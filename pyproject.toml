[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relayx"
version = "0.1.0"
description = "Python SDK for the RelayX OpenAI-compatible AI gateway"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "RelayX" }]
license = { text = "Apache-2.0" }
keywords = ["relayx", "ai", "gateway", "openai", "llm"]

[tool.setuptools.packages.find]
include = ["relayx*"]
